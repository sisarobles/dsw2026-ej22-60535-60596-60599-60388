<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">
</head>
<body>
  <main class="login-container">
    <div class="login-brand">
      <div class="logo">♢</div>
      <h1>MedPortal</h1>
    </div>
    <form class="login-card" id="login-form">
      <h2>Bienvenido de nuevo</h2>
      <p>Por favor, autentíquese para acceder al portal de proveedores.</p>
      <label for="usuario">Nombre de Usuario</label>
      <input id="usuario" type="text" name="usuario" placeholder="Ingrese ID de admin" requiered>
      <label for="contraseña">Contraseña</label>
      <input id="contraseña" type="password" name="password" placeholder="••••••••" required>
      <button type="submit">Iniciar Sesión</button>
      <div class="seguridad-aviso"> 
        <h3>Solo Acceso Seguro</h3>
        <p>Este sistema es para personal médico autorizado. 
          Los intentos de acceso no autorizados son registrados 
          y monitoreados para su cumplimiento.</p>
      </div>
    </form>
  </main>
  
  <script src="login.js"></script>

  </div>
</body>
</html>
