<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio de Sesion</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="login_style.css">

  <script src="login.js"></script>
</head>
<body class="login-body">
<img src="C:\Facultad\Tercer año\Desarrollo de SW\Segundo Cuatrimestre\Ejercicio_22\LogoMedPortal.png" alt="Logo MedPortal" class="login-logo">

  <h1>MedPortal</h1>

  <div class="login-container">
    <form>

      <div class="Inicio">
      <h4 class="bienvenida">Bienvenido de nuevo</h4>
      <p>Por favor, autentíquese para acceder al portal de proveedores.</p>
      </div>

      <div class="fields">
      <div class="field">
      <label for="username">Nombre de usuario</label>
      <input type="text" id="username" name="username" placeholder="Ingrese ID de admin" required>
      </div>

      <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" name="password" required>
      </div>
      </div>

      <button type="submit" id="btnInicioSesion">Iniciar Sesión</button>

      <div class="aviso">
        <p><strong>Solo Acceso Seguro:</strong> Este sistema es para personal médico autorizado.
        Los intentos de acceso no autorizados son registrados y monitoreados para su cumplimiento.
        </p>
      </div>
    </form>
  </div>
</body>
</html>
